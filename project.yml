name: StocksDetective
options:
  bundleIdPrefix: com.stocksdetective
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  DetectiveKit:
    path: Packages/DetectiveKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StocksDetective:
    type: application
    platform: iOS
    sources:
      - StocksDetective
    dependencies:
      - package: DetectiveKit
    info:
      path: StocksDetective/Info.plist
      properties:
        CFBundleDisplayName: Stocks Detective
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.stocksdetective.app.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stocksdetective.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
