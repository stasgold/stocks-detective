name: Build iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: DetectiveKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        working-directory: Packages/DetectiveKit
        run: swift test

  ios-build:
    name: Build iOS app (Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: bash scripts/select_xcode.sh

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project StocksDetective.xcodeproj \
            -scheme StocksDetective \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: App unit tests (Simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project StocksDetective.xcodeproj \
            -scheme StocksDetective \
            -destination "id=$UDID" \
            -only-testing:StocksDetectiveTests \
            -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project StocksDetective.xcodeproj \
            -scheme StocksDetective \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify --renderer github-actions

      - name: Package artifacts
        run: |
          mkdir -p out Payload
          cp -R build/device/Build/Products/Release-iphoneos/StocksDetective.app Payload/
          zip -qry out/StocksDetective-unsigned.ipa Payload
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/out/StocksDetective-simulator.zip" StocksDetective.app)
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: StocksDetective
          path: out/*
