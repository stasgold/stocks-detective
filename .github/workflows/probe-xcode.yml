name: Probe runners for Xcode 27

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app
