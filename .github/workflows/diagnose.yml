name: Diagnose crash

on:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Also run the Simulator UI tests
        type: boolean
        default: true

jobs:
  live-data:
    name: Live prices and news (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'swift:6.1-noble' || null }}
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: bash scripts/select_xcode.sh
      - name: Call live endpoints
        working-directory: Packages/DetectiveKit
        env:
          LIVE_NETWORK: "1"
        run: swift test --filter Live 2>&1 | grep -E "CHART|PRICES|NEWS|FEED|CASE|REPORT|   - |STOCK|TODAY|BENCH|BETA|TYPICAL|VOLUME|STATISTICAL|HEADLINES|^- |error|failed|passed|Executed"

  testflight-crashes:
    name: Fetch TestFlight crash reports
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Write API key
        run: bash scripts/write_asc_key.sh
      - name: Fetch
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/asc_crash_logs.py
          rm -f "$KEY_PATH"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: testflight-crashes
          path: out/crashes
          retention-days: 1
          if-no-files-found: ignore

  simulator-smoke:
    name: Import UI tests in Simulator
    if: ${{ inputs.ui_tests }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: bash scripts/select_xcode.sh
      - run: brew install xcodegen xcbeautify
      - run: xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run import UI tests (Release build, like TestFlight)
        run: |
          set -o pipefail
          xcodebuild test -project StocksDetective.xcodeproj -scheme StocksDetective -configuration Release \
            -destination "id=$UDID" -resultBundlePath out/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES | xcbeautify
      - name: Crash summary
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path out/UITests.xcresult 2>/dev/null | python3 -c "
          import json,sys
          def walk(n,d=0):
              if n.get('result') in ('Failed',) or n.get('nodeType')=='Failure Message':
                  print('  '*d + (n.get('nodeType','')+': '+n.get('name',''))[:1500])
              for c in n.get('children',[]): walk(c,d+1)
          for t in json.load(sys.stdin).get('testNodes',[]): walk(t)
          " || true
          for f in $(find ~/Library/Logs/DiagnosticReports -name "StocksDetective*" 2>/dev/null); do
            echo "===== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          try:
              body = json.loads(raw.split("\n", 1)[1])
          except Exception:
              print(raw[:5000]); sys.exit()
          ex = body.get("exception", {}); print("Exception:", ex.get("type"), ex.get("signal"), ex.get("subtype", ""))
          print("Termination:", body.get("termination", {}).get("indicator", ""))
          for k in ("asi", "lastExceptionBacktrace"):
              if k in body: print(k, json.dumps(body[k])[:1500])
          images = body.get("usedImages", [])
          for i, t in enumerate(body.get("threads", [])):
              frames = t.get("frames", [])
              names = [images[fr["imageIndex"]]["name"] if fr.get("imageIndex", -1) < len(images) else "?" for fr in frames]
              if not t.get("triggered") and not any(n in ("StocksDetective", "DetectiveKit", "FoundationModels") or "Concurrency" in n for n in names):
                  continue
              print(f"Thread {i}{' CRASHED' if t.get('triggered') else ''}:", t.get("queue", ""))
              for fr, img in list(zip(frames, names))[:40]:
                  print("  ", img, fr.get("symbol", hex(fr.get("imageOffset", 0))), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done
