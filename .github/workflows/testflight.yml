name: TestFlight

# Run manually from the Actions tab, or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README › TestFlight."
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: bash scripts/write_asc_key.sh

      - name: Resolve Team ID
        run: |
          if [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "Using APPLE_TEAM_ID from secrets"
            exit 0
          fi
          echo "::warning::APPLE_TEAM_ID is not a 10-character Team ID; looking it up from App Store Connect."
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          TEAM=$("$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, time, urllib.request, jwt
          key = open(os.environ["KEY_PATH"]).read()
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          url = "https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=com.stocksdetective.app&fields[bundleIds]=identifier,seedId"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          data = json.load(urllib.request.urlopen(req))["data"]
          match = [d for d in data if d["attributes"]["identifier"] == "com.stocksdetective.app"]
          if not match:
              raise SystemExit("Bundle ID com.stocksdetective.app is not registered under this API key's team.")
          print(match[0]["attributes"]["seedId"])
          PY
          )
          echo "Found Team ID (length ${#TEAM}). Tip: update the APPLE_TEAM_ID secret to it."
          echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project StocksDetective.xcodeproj \
            -scheme StocksDetective \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StocksDetective.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | xcbeautify --renderer github-actions

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StocksDetective.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify --renderer github-actions
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5-30 min)."

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
